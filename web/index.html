<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070506">
  <link rel="icon" href="data:,">
  <title>Tech Horror Stories</title>
  <link rel="preload" href="fonts/creepster.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="submit.css">
</head>
<body>
  <main>
    <h1>Tech Horror Stories</h1>
    <p class="lede">Tell us your worst production moment in 280 characters. No names, no emails, no secrets. It goes straight to the big screen.</p>
    <form id="form" novalidate>
      <label for="story" class="sr-only">Your story</label>
      <textarea id="story" maxlength="280" rows="6" placeholder="It was 4:58pm on a Friday..." required></textarea>
      <div class="row">
        <span id="count" aria-live="polite">0 / 280</span>
        <button id="send" type="submit" disabled>Submit</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="watch" hidden><a href="board.html">Watch the board &rarr;</a></p>
    <p class="fine">Stories are moderated by a machine and classified by an AI model. Rejected ones end up in the Graveyard.</p>
  </main>
  <script src="submit.js"></script>
</body>
</html>
